name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; match = re.search(r'[a-zA-Z0-9]{20}', os.environ['SUPABASE_PROJECT_ID']); print(match.group(0) if match else os.environ['SUPABASE_PROJECT_ID'].strip('\r\n\t '))")
          supabase functions deploy --project-ref "$CLEAN_PROJECT_ID"

      - name: Push Database Migrations
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; match = re.search(r'[a-zA-Z0-9]{20}', os.environ['SUPABASE_PROJECT_ID']); print(match.group(0) if match else os.environ['SUPABASE_PROJECT_ID'].strip('\r\n\t '))")
          ENCODED_PASSWORD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote_plus(os.environ['SUPABASE_DB_PASSWORD'].strip('\r\n\t ')))")
          supabase db push --db-url "postgresql://postgres.${CLEAN_PROJECT_ID}:${ENCODED_PASSWORD}@aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres"
