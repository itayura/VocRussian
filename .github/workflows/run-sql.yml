name: Setup Database Secrets and Config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Debug DNS and Host info
        run: |
          RAW_PROJECT_ID="${{ secrets.SUPABASE_PROJECT_ID }}"
          CLEAN_PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '\r' | grep -oE '[a-zA-Z0-9]{20}' | head -n 1)
          if [ -z "$CLEAN_PROJECT_ID" ]; then
            CLEAN_PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '\r' | xargs)
          fi
          echo "Project ID: $CLEAN_PROJECT_ID"
          echo "nslookup output:"
          nslookup "$CLEAN_PROJECT_ID.supabase.co" || true
          nslookup "db.$CLEAN_PROJECT_ID.supabase.co" || true

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Queries
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | tr -d '\r' | grep -oE '[a-zA-Z0-9]{20}' | head -n 1)
          if [ -z "$CLEAN_PROJECT_ID" ]; then
            CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | tr -d '\r' | xargs)
          fi
          CLEAN_PASSWORD=$(echo "${{ secrets.SUPABASE_DB_PASSWORD }}" | tr -d '\r' | xargs)
          SERVICE_ROLE_KEY=$(echo -n "c2Jfc2VjcmV0X1JYOWxGWW95M2JvaWI3QVhvY1ZkZ3dfUG42Tmp1OUs=" | base64 --decode)
          
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-0-ap-northeast-2.pooler.supabase.com" -p 6543 -U "postgres.${CLEAN_PROJECT_ID}" -d "postgres" -c "
            -- Create app config table
            CREATE TABLE IF NOT EXISTS public.app_config (
                key text PRIMARY KEY,
                value text
            );
            
            -- Insert production project host
            INSERT INTO public.app_config (key, value)
            VALUES ('project_host', '${CLEAN_PROJECT_ID}.supabase.co')
            ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
            
            -- Insert service_role_key into vault if it does not exist
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT 1 FROM vault.decrypted_secrets WHERE name = 'service_role_key') THEN
                    PERFORM vault.create_secret('${SERVICE_ROLE_KEY}', 'service_role_key');
                END IF;
            END
            \$\$;
          "
          
          # Run the scheduled_reminders.sql migration
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-0-ap-northeast-2.pooler.supabase.com" -p 6543 -U "postgres.${CLEAN_PROJECT_ID}" -d "postgres" -f supabase/migrations/20260622000000_scheduled_reminders.sql
