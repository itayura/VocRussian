<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <radialGradient id="clayBg_v_28" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2E1513" />
      <stop offset="60%" stop-color="#1A0A09" />
      <stop offset="100%" stop-color="#08060D" />
    </radialGradient>
    <radialGradient id="claySphere_v_28" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="55%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#0A0812" />
    </radialGradient>
    <radialGradient id="clayHighlight_v_28" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="clayShadow_v_28" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="rgba(0,0,0,0.65)" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.4)" />
    </filter>
    <filter id="softGlow_v_28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Full Bleed Card Background -->
  <rect width="360" height="480" fill="url(#clayBg_v_28)" />

  <!-- Ambient Light Backdrop Orb -->
  <circle cx="180" cy="230" r="140" fill="#E74C3C" opacity="0.18" filter="url(#softGlow_v_28)" />
  
  <!-- Outer Rounded Podium Ring -->
  <rect x="40" y="80" width="280" height="320" rx="48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  
  <!-- 3D Clay Central Sphere -->
  <g filter="url(#clayShadow_v_28)">
    <circle cx="180" cy="235" r="105" fill="url(#claySphere_v_28)" />
    <circle cx="180" cy="235" r="105" fill="url(#clayHighlight_v_28)" />
  </g>

  <!-- Large Central Semantic Visual Icon -->
  <text x="180" y="248" font-size="92" text-anchor="middle" dominant-baseline="middle" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))">🏡</text>

  <!-- Bottom Visual Anchor Rings -->
  <ellipse cx="180" cy="370" rx="90" ry="16" fill="black" opacity="0.3" filter="url(#softGlow_v_28)" />
  <circle cx="180" cy="430" r="4" fill="#E74C3C" opacity="0.4" />
  <circle cx="164" cy="430" r="2.5" fill="#E74C3C" opacity="0.2" />
  <circle cx="196" cy="430" r="2.5" fill="#E74C3C" opacity="0.2" />
</svg>