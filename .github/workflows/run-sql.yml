name: Setup Database Secrets and Config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Project Details from Supabase API
        run: |
          RAW_PROJECT_ID="${{ secrets.SUPABASE_PROJECT_ID }}"
          CLEAN_PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '\r' | grep -oE '[a-zA-Z0-9]{20}' | head -n 1)
          if [ -z "$CLEAN_PROJECT_ID" ]; then
            CLEAN_PROJECT_ID=$(echo "$RAW_PROJECT_ID" | tr -d '\r' | xargs)
          fi
          
          # Fetch project info from Management API
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" "https://api.supabase.com/v1/projects/$CLEAN_PROJECT_ID")
          echo "Management API Response:"
          echo "$RESPONSE"
