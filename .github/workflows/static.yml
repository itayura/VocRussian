# Simple workflow for running Playwright tests on pushes
name: CI Test Suite

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright E2E & Layout Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
         uses: actions/checkout@v4
         
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run E2E & Layout Tests
        run: npx playwright test

