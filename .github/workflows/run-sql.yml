name: Setup Database Secrets and Config
# Trigger run to execute with python-based postgresql connection host aws-1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'
      - 'supabase/migrations/**'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Queries
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import subprocess
          import os
          import re

          raw_project_id = os.environ['SUPABASE_PROJECT_ID']
          # Extract project reference (20-character alphanumeric)
          match = re.search(r'[a-zA-Z0-9]{20}', raw_project_id)
          project_id = match.group(0) if match else raw_project_id.strip('\r\n\t ')

          password = os.environ['SUPABASE_DB_PASSWORD'].strip('\r\n\t ')
          service_role_key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip('\r\n\t ').replace(chr(39), chr(39) * 2)
          if not service_role_key:
              raise RuntimeError('SUPABASE_SERVICE_ROLE_KEY is required')

          sql = f'''
          -- Create app config table
          CREATE TABLE IF NOT EXISTS public.app_config (
              key text PRIMARY KEY,
              value text
          );

          ALTER TABLE public.app_config ENABLE ROW LEVEL SECURITY;

          DO \$\$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_policies WHERE tablename = \\'app_config\\' AND policyname = \\'Allow public read access to app_config\\'
              ) THEN
                  CREATE POLICY \\'Allow public read access to app_config\\'
                      ON public.app_config FOR SELECT
                      TO anon, authenticated
                      USING (true);
              END IF;
          END \$\$;

          -- Insert production project host
          INSERT INTO public.app_config (key, value)
          VALUES (\\'project_host\\', \\'{project_id}.supabase.co\\')
          ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;

          -- Create or rotate the Vault value supplied through GitHub Actions secrets.
          DO \$\$
          DECLARE existing_id uuid;
          BEGIN
              SELECT id INTO existing_id FROM vault.secrets WHERE name = \'service_role_key\' LIMIT 1;
              IF existing_id IS NULL THEN
                  PERFORM vault.create_secret(\'{service_role_key}\', \'service_role_key\');
              ELSE
                  PERFORM vault.update_secret(existing_id, \'{service_role_key}\', \'service_role_key\');
              END IF;
          END
          \$\$;
          '''

          env = os.environ.copy()
          env['PGPASSWORD'] = password

          print('Running config SQL query...')
          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-v', 'ON_ERROR_STOP=1'
          ], env=env, input=sql, text=True, check=True)

          print('Running migration files...')
          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260723000000_reminder_logs.sql'
          ], env=env, check=True)

          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260622000000_scheduled_reminders.sql'
          ], env=env, check=True)

          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260805000000_grammar_attempt_evidence.sql'
          ], env=env, check=True)

          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260805010000_security_and_schema_hardening.sql'
          ], env=env, check=True)

          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260805020000_sync_event_logs.sql'
          ], env=env, check=True)

          print('Database configuration completed successfully!')
          "
