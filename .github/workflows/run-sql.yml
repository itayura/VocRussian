name: Setup Database Secrets and Config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Queries
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | tr -d '\r' | grep -oE '[a-zA-Z0-9]{20}' | head -n 1)
          if [ -z "$CLEAN_PROJECT_ID" ]; then
            CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | tr -d '\r' | xargs)
          fi
          CLEAN_PASSWORD=$(echo "${{ secrets.SUPABASE_DB_PASSWORD }}" | tr -d '\r' | xargs)
          SERVICE_ROLE_KEY=$(echo -n "c2Jfc2VjcmV0X1JYOWxGWW95M2JvaWI3QVhvY1ZkZ3dfUG42Tmp1OUs=" | base64 --decode)
          
          echo "==== Connection Tests ===="
          
          echo "Test 1: aws-0-ap-northeast-2.pooler.supabase.com:6543 with postgres.$CLEAN_PROJECT_ID"
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-0-ap-northeast-2.pooler.supabase.com" -p 6543 -U "postgres.$CLEAN_PROJECT_ID" -d "postgres" -c "SELECT 1" 2>&1 || true
          
          echo "Test 2: aws-0-ap-northeast-2.pooler.supabase.com:5432 with postgres.$CLEAN_PROJECT_ID"
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-0-ap-northeast-2.pooler.supabase.com" -p 5432 -U "postgres.$CLEAN_PROJECT_ID" -d "postgres" -c "SELECT 1" 2>&1 || true
          
          echo "Test 3: aws-1-ap-northeast-2.pooler.supabase.com:6543 with postgres.$CLEAN_PROJECT_ID"
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-1-ap-northeast-2.pooler.supabase.com" -p 6543 -U "postgres.$CLEAN_PROJECT_ID" -d "postgres" -c "SELECT 1" 2>&1 || true

          echo "Test 4: aws-1-ap-northeast-2.pooler.supabase.com:5432 with postgres.$CLEAN_PROJECT_ID"
          PGPASSWORD="$CLEAN_PASSWORD" psql -h "aws-1-ap-northeast-2.pooler.supabase.com" -p 5432 -U "postgres.$CLEAN_PROJECT_ID" -d "postgres" -c "SELECT 1" 2>&1 || true
          
          echo "=========================="
