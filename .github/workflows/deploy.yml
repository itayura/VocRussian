name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | xargs)
          supabase functions deploy --project-ref "$CLEAN_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Database Migrations
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.SUPABASE_PROJECT_ID }}" | xargs)
          CLEAN_PASSWORD=$(echo "${{ secrets.SUPABASE_DB_PASSWORD }}" | xargs)
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote_plus('''$CLEAN_PASSWORD'''))")
          supabase db push --db-url "postgresql://postgres.${CLEAN_PROJECT_ID}:${ENCODED_PASSWORD}@aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres"
