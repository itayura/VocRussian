name: Setup Database Secrets and Config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'
      - 'supabase/migrations/**'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure Database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; value = os.environ['SUPABASE_PROJECT_ID']; match = re.search(r'[a-zA-Z0-9]{20}', value); print(match.group(0) if match else value.strip())")
          export PGPASSWORD="$(python3 -c "import os; print(os.environ['SUPABASE_DB_PASSWORD'].strip())")"
          export SUPABASE_PROJECT_HOST="${CLEAN_PROJECT_ID}.supabase.co"

          psql             -h aws-1-ap-northeast-2.pooler.supabase.com             -p 6543             -U "postgres.${CLEAN_PROJECT_ID}"             -d postgres             -v ON_ERROR_STOP=1 <<'SQL'
          \getenv project_host SUPABASE_PROJECT_HOST
          \getenv service_role_key SUPABASE_SERVICE_ROLE_KEY

          CREATE TABLE IF NOT EXISTS public.app_config (
            key text PRIMARY KEY,
            value text
          );
          ALTER TABLE public.app_config ENABLE ROW LEVEL SECURITY;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'app_config'
                AND policyname = 'Allow public read access to app_config'
            ) THEN
              CREATE POLICY "Allow public read access to app_config"
                ON public.app_config FOR SELECT
                TO anon, authenticated
                USING (true);
            END IF;
          END $$;

          INSERT INTO public.app_config (key, value)
          VALUES ('project_host', :'project_host')
          ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;

          SELECT vault.update_secret(id, :'service_role_key', 'service_role_key')
          FROM vault.secrets
          WHERE name = 'service_role_key'
            AND :'service_role_key' <> '';

          SELECT vault.create_secret(:'service_role_key', 'service_role_key')
          WHERE :'service_role_key' <> ''
            AND NOT EXISTS (
              SELECT 1 FROM vault.secrets WHERE name = 'service_role_key'
            );
          SQL
