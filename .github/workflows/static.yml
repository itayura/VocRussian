# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Manual runs can optionally publish the tested bundle to a selected Play track.
  workflow_dispatch:
    inputs:
      publish_play:
        description: Publish the signed Android bundle to Google Play after all checks pass
        required: true
        type: boolean
        default: false
      play_track:
        description: Exact existing non-production Play track ID (usually alpha for closed testing)
        required: true
        type: string
        default: alpha

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run release checks and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Validate release configuration
        run: npm run test:preflight

      - name: Run logic, E2E & layout tests
        run: npm test

  # Deploy job
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Write immutable web build metadata
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: node scripts/write-build-info.js
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Android Build job
  android-build:
    needs: test
    name: Build Android App (AAB/APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Packages Manually
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          SDKMANAGER=""
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
          fi
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses
          yes | $SDKMANAGER "build-tools;34.0.0" "platforms;android-34" "platforms;android-35" "platforms;android-36"
          
          # Create symlink for Bubblewrap compatibility
          if [ ! -d "$ANDROID_HOME/tools" ] && [ ! -L "$ANDROID_HOME/tools" ]; then
            ln -s cmdline-tools/latest $ANDROID_HOME/tools
          fi
          
          echo "Listing tools/bin folder:"
          ls -la $ANDROID_HOME/tools/bin || echo "tools/bin not found"
          echo "Listing build-tools folder:"
          ls -la $ANDROID_HOME/build-tools || echo "build-tools not found"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          bubblewrap doctor

      - name: Bump Android version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Use the workflow run number in a high range so every Play upload has
          # a unique version code, even when the checked-in manifest is stale.
          NEXT_VERSION_CODE=$((100000 + RUN_NUMBER))
          sed -i -E "s/\"appVersionCode\": [0-9]+/\"appVersionCode\": $NEXT_VERSION_CODE/" twa-manifest.json
          echo "Using Android versionCode $NEXT_VERSION_CODE"
      - name: Generate Android Project
        run: |
          bubblewrap update --skipVersionUpgrade
          sed -i 's/targetSdkVersion 35/targetSdkVersion 36/g' app/build.gradle || true
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' app/build.gradle || true
          python3 scripts/patch-android-edge-to-edge.py


      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          ls -la android.keystore

      - name: Build Android App Bundle (AAB) & APK (Signed)
        run: |
          bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASS }}

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-artifacts
          path: |
            *.apk
            *.aab
  # Play publication is deliberately manual. Configure required reviewers on
  # the google-play GitHub Environment for a second approval gate.
  deploy-play-store:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_play }}
    needs: android-build
    name: Deploy Android App to Google Play
    runs-on: ubuntu-latest
    environment:
      name: google-play
    steps:
      - name: Download Android build artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-build-artifacts
          path: android-artifacts

      - name: Reject production publication from this workflow
        shell: bash
        env:
          TARGET_TRACK: ${{ inputs.play_track }}
        run: |
          if [[ -z "$TARGET_TRACK" || "$TARGET_TRACK" == "production" ]]; then
            echo "Choose the existing internal or closed-test track; production is intentionally blocked."
            exit 1
          fi

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.itayura.privyetik
          releaseFiles: android-artifacts/*.aab
          tracks: ${{ inputs.play_track }}
          status: completed

      - name: Record publication summary
        run: |
          echo "### Google Play publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Track: ${{ inputs.play_track }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
