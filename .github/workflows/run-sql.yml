name: Setup Database Secrets and Config
# Trigger run to execute with python-based postgresql connection host aws-1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-sql.yml'

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Queries
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python3 -c "
          import subprocess
          import os
          import re
          import base64

          raw_project_id = os.environ['SUPABASE_PROJECT_ID']
          # Extract project reference (20-character alphanumeric)
          match = re.search(r'[a-zA-Z0-9]{20}', raw_project_id)
          project_id = match.group(0) if match else raw_project_id.strip('\r\n\t ')

          password = os.environ['SUPABASE_DB_PASSWORD'].strip('\r\n\t ')
          service_role_key = base64.b64decode('c2Jfc2VjcmV0X1JYOWxGWW95M2JvaWI3QVhvY1ZkZ3dfUG42Tmp1OUs=').decode('utf-8')

          sql = f'''
          -- Create app config table
          CREATE TABLE IF NOT EXISTS public.app_config (
              key text PRIMARY KEY,
              value text
          );

          ALTER TABLE public.app_config ENABLE ROW LEVEL SECURITY;

          DO \$\$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_policies WHERE tablename = \\'app_config\\' AND policyname = \\'Allow public read access to app_config\\'
              ) THEN
                  CREATE POLICY \\'Allow public read access to app_config\\'
                      ON public.app_config FOR SELECT
                      TO anon, authenticated
                      USING (true);
              END IF;
          END \$\$;

          -- Insert production project host
          INSERT INTO public.app_config (key, value)
          VALUES (\\'project_host\\', \\'{project_id}.supabase.co\\')
          ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;

          -- Insert service_role_key into vault if it does not exist
          DO \$\$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM vault.decrypted_secrets WHERE name = \\'service_role_key\\') THEN
                  PERFORM vault.create_secret(\\'{service_role_key}\\', \\'service_role_key\\');
              END IF;
          END
          \$\$;
          '''

          env = os.environ.copy()
          env['PGPASSWORD'] = password

          print('Running config SQL query...')
          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-c', sql
          ], env=env, check=True)

          print('Running migration files...')
          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260622000000_scheduled_reminders.sql'
          ], env=env, check=True)
          
          subprocess.run([
              'psql',
              '-h', 'aws-1-ap-northeast-2.pooler.supabase.com',
              '-p', '6543',
              '-U', f'postgres.{project_id}',
              '-d', 'postgres',
              '-f', 'supabase/migrations/20260723000000_reminder_logs.sql'
          ], env=env, check=True)
          
          print('Database configuration completed successfully!')
          "
