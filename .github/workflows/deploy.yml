name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Internal Push Function
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; value = os.environ['SUPABASE_PROJECT_ID']; match = re.search(r'[a-zA-Z0-9]{20}', value); print(match.group(0) if match else value.strip())")
          supabase functions deploy send-push --no-verify-jwt --project-ref "$CLEAN_PROJECT_ID"

      - name: Verify New Reminder Authentication
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_REMINDERS_SECRET_KEY: ${{ secrets.SUPABASE_REMINDERS_SECRET_KEY }}
        run: |
          python3 -c "
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          project_value = os.environ['SUPABASE_PROJECT_ID']
          match = re.search(r'[a-zA-Z0-9]{20}', project_value)
          project_id = match.group(0) if match else project_value.strip()
          secret_key = os.environ['SUPABASE_REMINDERS_SECRET_KEY'].strip()
          if not secret_key.startswith('sb_secret_'):
              raise RuntimeError('SUPABASE_REMINDERS_SECRET_KEY is missing or invalid')

          request = urllib.request.Request(
              f'https://{project_id}.supabase.co/functions/v1/send-push',
              data=json.dumps({
                  'userId': 'authentication-check',
                  'title': 'Authentication check',
                  'body': 'This request must never send a notification'
              }).encode(),
              headers={'Content-Type': 'application/json', 'apikey': secret_key},
              method='POST'
          )

          try:
              urllib.request.urlopen(request, timeout=30)
              raise RuntimeError('Authentication check unexpectedly accepted an invalid target')
          except urllib.error.HTTPError as error:
              response = error.read().decode()
              if error.code != 400 or 'Invalid target user.' not in response:
                  raise RuntimeError(f'New reminder key authentication failed with HTTP {error.code}')
              print('New reminders secret authenticated successfully')
          "

      - name: Push Database Migrations
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; value = os.environ['SUPABASE_PROJECT_ID']; match = re.search(r'[a-zA-Z0-9]{20}', value); print(match.group(0) if match else value.strip())")
          ENCODED_PASSWORD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote_plus(os.environ['SUPABASE_DB_PASSWORD'].strip()))")
          supabase db push --yes --db-url "postgresql://postgres.${CLEAN_PROJECT_ID}:${ENCODED_PASSWORD}@aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres"

      - name: Deploy User Edge Functions
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          CLEAN_PROJECT_ID=$(python3 -c "import os, re; value = os.environ['SUPABASE_PROJECT_ID']; match = re.search(r'[a-zA-Z0-9]{20}', value); print(match.group(0) if match else value.strip())")
          for FUNCTION_NAME in add-word ai-grammar generate-sentence delete-account; do
            supabase functions deploy "$FUNCTION_NAME" --no-verify-jwt --project-ref "$CLEAN_PROJECT_ID"
          done

      - name: Verify Publishable Key Authentication
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python3 -c "
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          project_value = os.environ['SUPABASE_PROJECT_ID']
          project_match = re.search(r'[a-zA-Z0-9]{20}', project_value)
          project_id = project_match.group(0) if project_match else project_value.strip()
          client_source = open('js/config.js', encoding='utf-8').read()
          key_match = re.search(r'sb_publishable_[A-Za-z0-9_-]+', client_source)
          if not key_match:
              raise RuntimeError('Publishable key was not found in the client configuration')

          request = urllib.request.Request(
              f'https://{project_id}.supabase.co/functions/v1/add-word',
              data=json.dumps({'word': 'authentication-check'}).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'apikey': key_match.group(0),
                  'Authorization': 'Bearer invalid-authentication-check'
              },
              method='POST'
          )

          try:
              urllib.request.urlopen(request, timeout=30)
              raise RuntimeError('User authentication check unexpectedly succeeded')
          except urllib.error.HTTPError as error:
              response = error.read().decode()
              if error.code != 401 or 'valid signed-in session is required' not in response:
                  raise RuntimeError(f'Publishable key authentication failed with HTTP {error.code}')
              print('Publishable key reached function-level user authentication successfully')

          delete_request = urllib.request.Request(
              f'https://{project_id}.supabase.co/functions/v1/delete-account',
              data=json.dumps({'confirmationEmail': 'invalid@example.com'}).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'apikey': key_match.group(0),
                  'Authorization': 'Bearer invalid-authentication-check'
              },
              method='POST'
          )
          try:
              urllib.request.urlopen(delete_request, timeout=30)
              raise RuntimeError('Account deletion authentication check unexpectedly succeeded')
          except urllib.error.HTTPError as error:
              response = error.read().decode()
              if error.code != 401 or 'valid signed-in session is required' not in response:
                  raise RuntimeError(f'Account deletion authentication failed with HTTP {error.code}')
              print('Account deletion rejects an invalid bearer token successfully')
          "
