<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <linearGradient id="vecBg_v_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1513" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="vecAccent_v_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="100%" stop-color="#C0392B" />
    </linearGradient>
    <pattern id="vecGrid_v_28" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Full Bleed Background with subtle geometric texture -->
  <rect width="360" height="480" fill="url(#vecBg_v_28)" />
  <rect width="360" height="480" fill="url(#vecGrid_v_28)" />

  <!-- Geometric Framed Elements -->
  <rect x="35" y="60" width="290" height="360" rx="32" fill="rgba(255,255,255,0.03)" stroke="#E74C3C" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Diagonal accent stripes -->
  <path d="M45,70 L110,70 L70,110 Z" fill="#E74C3C" opacity="0.15" />
  <path d="M315,410 L250,410 L290,370 Z" fill="#C0392B" opacity="0.15" />

  <!-- Center Hexagon / Circular Shield -->
  <polygon points="180,125 270,175 270,295 180,345 90,295 90,175" fill="url(#vecAccent_v_28)" opacity="0.2" stroke="#E74C3C" stroke-width="2" />
  <circle cx="180" cy="235" r="85" fill="url(#vecAccent_v_28)" />
  
  <!-- Semantic Icon -->
  <text x="180" y="248" font-size="88" text-anchor="middle" dominant-baseline="middle">🏡</text>

  <!-- Framing Accents -->
  <circle cx="180" cy="400" r="5" fill="#E74C3C" />
  <line x1="140" y1="400" x2="165" y2="400" stroke="#E74C3C" stroke-width="2" opacity="0.5" />
  <line x1="195" y1="400" x2="220" y2="400" stroke="#E74C3C" stroke-width="2" opacity="0.5" />
</svg>